# Build raptor-balar-test and run the full Balar + Quetz cross-stack suite on native
# linux/amd64. Item #2 (Quetz tests inside the CUDA/GPGPU-Sim image) cannot run under
# Docker Desktop Rosetta on Apple Silicon; this workflow is the supported CI path.

name: Balar Docker tests

on:
  push:
    branches: [main, quetz-gpu-balar-combined]
  pull_request:
    branches: [main, quetz-gpu-balar-combined]
  workflow_dispatch:
    inputs:
      sst_elements_ref:
        description: sst-elements branch or ref (empty = auto-resolve from the
          triggering branch; quetz-gpu-balar-combined for the cross-stack tree)
        required: false
        default: ""
      sst_core_ref:
        description: sst-core branch or ref
        required: false
        default: devel
      run_quetz_lightweight:
        description: Also run ./quetz-docker/build-and-test.sh (item #1)
        type: boolean
        default: false

concurrency:
  group: balar-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  balar-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Resolve dependency refs
        id: refs
        run: |
          if [ -n "${{ github.event.inputs.sst_elements_ref }}" ]; then
            elements_ref="${{ github.event.inputs.sst_elements_ref }}"
          elif [ "${{ github.ref_name }}" = "quetz-gpu-balar-combined" ] \
            || [ "${{ github.base_ref }}" = "quetz-gpu-balar-combined" ]; then
            elements_ref="quetz-gpu-balar-combined"
          else
            elements_ref="balar-integration"
          fi

          if [ -n "${{ github.event.inputs.sst_core_ref }}" ]; then
            core_ref="${{ github.event.inputs.sst_core_ref }}"
          else
            core_ref="devel"
          fi

          # The combined tree must run the Quetz cross-stack suite; mark it
          # required so a misconfigured checkout (e.g. balar-integration, which
          # has no quetz element) hard-fails instead of silently passing.
          if [ "${elements_ref}" = "quetz-gpu-balar-combined" ]; then
            crossstack_required=1
          else
            crossstack_required=0
          fi

          echo "elements_ref=${elements_ref}" >> "${GITHUB_OUTPUT}"
          echo "core_ref=${core_ref}" >> "${GITHUB_OUTPUT}"
          echo "crossstack_required=${crossstack_required}" >> "${GITHUB_OUTPUT}"
          echo "Using sst-elements@${elements_ref}, sst-core@${core_ref} (cross-stack required=${crossstack_required})"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Checkout quetz-docker
        uses: actions/checkout@v4
        with:
          path: raptor-balar/quetz-docker

      - name: Checkout sst-core
        uses: actions/checkout@v4
        with:
          repository: sstsimulator/sst-core
          ref: ${{ steps.refs.outputs.core_ref }}
          path: raptor-balar/sst-core

      - name: Checkout sst-elements
        uses: actions/checkout@v4
        with:
          repository: nab880/sst-elements
          ref: ${{ steps.refs.outputs.elements_ref }}
          path: raptor-balar/sst-elements

      - name: Build and run Balar Docker tests
        working-directory: raptor-balar
        env:
          DOCKER_BUILDKIT: "1"
          QUETZ_CROSSSTACK_REQUIRED: ${{ steps.refs.outputs.crossstack_required }}
        run: ./quetz-docker/build-and-test-balar.sh

      # Surface SST per-test stdout/stderr so doorbell/flush failures are
      # debuggable without a local docker repro. sst-test-elements writes
      # under sst_test_outputs/; the sysmode_balar template also writes
      # quetz_sysmode_tests/<name>/<name>.out under that tree.
      # The Docker container writes sst_test_outputs as root via the bind mount,
      # so the runner cannot stat them (EACCES) when uploading. Relax perms first.
      - name: Fix SST output permissions for upload
        if: failure()
        run: sudo chmod -R a+rX raptor-balar/sst-elements/src/sst/elements/*/tests/sst_test_outputs || true

      - name: Upload SST test outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sst-test-outputs
          if-no-files-found: ignore
          path: |
            raptor-balar/sst-elements/src/sst/elements/quetz/tests/sst_test_outputs/**
            raptor-balar/sst-elements/src/sst/elements/balar/tests/sst_test_outputs/**

      - name: Run Quetz lightweight Docker tests (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_quetz_lightweight == 'true'
        working-directory: raptor-balar
        env:
          DOCKER_BUILDKIT: "1"
        run: ./quetz-docker/build-and-test.sh
